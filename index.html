<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Tools</title>
</head>
<body>
  <label for="speaker_1_frequency">Speaker 1 frequency (Hz):</label>
  <input type="text" id="speaker_1_frequency" name="speaker_1_frequency">
  <br>
  <label for="speaker_2_frequency">Speaker 2 frequency (Hz):</label>
  <input type="text" id="speaker_2_frequency" name="speaker_2_frequency">
  <br>
  <button id="startButton">Play Tones</button>
  
  <script>
    document.getElementById('startButton').addEventListener('click', () => {
      // Create an audio context
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      // Create first oscillator (for left speaker)
      const speaker1FrequencyInput = document.getElementById('speaker_1_frequency');
      const oscLeft = audioCtx.createOscillator();
      oscLeft.frequency.value = speaker1FrequencyInput.value;

      // Create second oscillator (for right speaker)
      const speaker2FrequencyInput = document.getElementById('speaker_2_frequency');
      const oscRight = audioCtx.createOscillator();
      oscRight.frequency.value = speaker2FrequencyInput.value;

      // Create stereo panners
      const pannerLeft = audioCtx.createStereoPanner();
      pannerLeft.pan.value = -1; // Hard left

      const pannerRight = audioCtx.createStereoPanner();
      pannerRight.pan.value = 1; // Hard right

      // Connect each oscillator to its panner
      oscLeft.connect(pannerLeft).connect(audioCtx.destination);
      oscRight.connect(pannerRight).connect(audioCtx.destination);

      // Start both oscillators
      oscLeft.start();
      oscRight.start();

      // Stop after 2 seconds
      setTimeout(() => {
          oscLeft.stop();
          oscRight.stop();
      }, 2000);
    });
  </script>
</body>
</html>
