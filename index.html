<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Tools</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
  <main class="container">
    <fieldset>
      <legend>Tone pattern:</legend>
      <input type="radio" id="pattern_constant" name="pattern" checked />
      <label htmlFor="pattern_constant">Constant</label>
      <input type="radio" id="pattern_sweep" name="pattern" />
      <label htmlFor="pattern_sweep">Sweep</label>
      <input type="radio" id="pattern_steps" name="pattern" />
      <label htmlFor="pattern_steps">Steps</label>
    </fieldset>

    <div id="settings_constant">
      <label for="speaker_1_frequency">Speaker 1 frequency (Hz):</label>
      <input type="text" id="speaker_1_frequency" name="speaker_1_frequency">
      <label for="speaker_2_frequency">Speaker 2 frequency (Hz):</label>
      <input type="text" id="speaker_2_frequency" name="speaker_2_frequency">
    </div>

    <div id="settings_sweep" hidden>
      <label for="speaker_1_start_frequency">Speaker 1 start frequency (Hz):</label>
      <input type="text" id="speaker_1_start_frequency" name="speaker_1_start_frequency">
      <label for="speaker_1_stop_frequency">Speaker 1 stop frequency (Hz):</label>
      <input type="text" id="speaker_1_stop_frequency" name="speaker_1_stop_frequency">
      <label for="speaker_2_start_frequency">Speaker 2 start frequency (Hz):</label>
      <input type="text" id="speaker_2_start_frequency" name="speaker_2_start_frequency">
      <label for="speaker_2_stop_frequency">Speaker 2 stop frequency (Hz):</label>
      <input type="text" id="speaker_2_stop_frequency" name="speaker_2_stop_frequency">
      <label for="sweep_duration">Sweep duration (sec):</label>
      <input type="text" id="sweep_duration" name="sweep_duration">
    </div>

    <div id="settings_steps" hidden>
      <label for="speaker_1_start_frequency2">Speaker 1 start frequency (Hz):</label>
      <input type="text" id="speaker_1_start_frequency2" name="speaker_1_start_frequency2">
      <label for="speaker_1_stop_frequency2">Speaker 1 stop frequency (Hz):</label>
      <input type="text" id="speaker_1_stop_frequency2" name="speaker_1_stop_frequency2">
      <label for="speaker_2_start_frequency2">Speaker 2 start frequency (Hz):</label>
      <input type="text" id="speaker_2_start_frequency2" name="speaker_2_start_frequency2">
      <label for="speaker_2_stop_frequency2">Speaker 2 stop frequency (Hz):</label>
      <input type="text" id="speaker_2_stop_frequency2" name="speaker_2_stop_frequency2">
      <label for="sweep_duration">Step increment (Hz):</label>
      <input type="text" id="step_increment" name="step_increment">
      <label for="sweep_duration">Step duration (sec):</label>
      <input type="text" id="step_duration" name="step_duration">
    </div>

    <button id="startButton">Start playing</button>
  </main>

  <script>
    let isPlaying = false;
    let pattern = 'constant';
    let audioCtx = null;
    let oscLeft = null;
    let oscRight = null;
    let pannerLeft = null;
    let pannerRight = null;

    let configuration = {};
    const startButton = document.getElementById('startButton');

    startButton.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        initAudio();
        configureAudio();
        startPlaying();
        startButton.innerText = 'Stop playing';
      } else {
        stopPlaying();
        startButton.innerText = 'Start playing';
      }
    });

    function initAudio() {
      // Create an audio context
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    initAudio();

    function loadConfiguration() {
      const properties = [
        'speaker_1_frequency',
        'speaker_2_frequency',
        'speaker_1_start_frequency',
        'speaker_2_start_frequency',
        'speaker_1_stop_frequency',
        'speaker_2_stop_frequency',
        'speaker_1_start_frequency2',
        'speaker_2_start_frequency2',
        'speaker_1_stop_frequency2',
        'speaker_2_stop_frequency2',
        'sweep_duration',
        'step_increment',
        'step_duration'
      ];

      configuration = {};
      properties.forEach((property) => {
        configuration[property] = document.getElementById(property).value;
      });
    }

    function isConfigurationValid(speakerId) {
      // speaker_id is 1 or 2
      let keys = [];
      if (pattern === 'constant') {
        keys = [`speaker_${speakerId}_frequency`];
      } else if (pattern === 'sweep') {
        keys = [
          `speaker_${speakerId}_start_frequency`,
          `speaker_${speakerId}_stop_frequency`,
        ];
      } else if (pattern === 'steps') {
        keys = [
          `speaker_${speakerId}_start_frequency2`,
          `speaker_${speakerId}_stop_frequency2`,
        ];
      }
      const values = Array.from(keys, (key) => configuration[key]);
      const checks = Array.from(values, (value) => isNumber(value));
      return checks.some((check) => check);
    }

    function isNumber(value) {
      return value.length > 0 && !isNaN(Number(value));
    }

    function configureAudio() {
      loadConfiguration();

      if (isConfigurationValid(1)) {
        oscLeft = audioCtx.createOscillator();
        configureOscillator(oscLeft, 1);

        pannerLeft = audioCtx.createStereoPanner();
        pannerLeft.pan.value = -1;

        oscLeft.connect(pannerLeft).connect(audioCtx.destination);
      } else {
        oscLeft = null;
        pannerLeft = null;
      }

      if (isConfigurationValid(2)) {
        oscRight = audioCtx.createOscillator();
        configureOscillator(oscRight, 2);

        pannerRight = audioCtx.createStereoPanner();
        pannerRight.pan.value = 1;

        oscRight.connect(pannerRight).connect(audioCtx.destination);
      } else {
        oscRight = null;
        pannerRight = null;
      }
    }

    function configureOscillator(oscillator, speakerId) {
      if (pattern === 'constant') {
        oscillator.frequency.value = configuration[`speaker_${speakerId}_frequency`];
      } else if (pattern === 'sweep') {
        oscillator.frequency.setValueAtTime(
          configuration[`speaker_${speakerId}_start_frequency`],
          audioCtx.currentTime
        );
        oscillator.frequency.linearRampToValueAtTime(
          configuration[`speaker_${speakerId}_stop_frequency`],
          audioCtx.currentTime + Number(configuration['sweep_duration'])
        );
      } else if (pattern === 'steps') {
        const startFreq = Number(configuration[`speaker_${speakerId}_start_frequency2`]);
        const stopFreq = Number(configuration[`speaker_${speakerId}_stop_frequency2`]);
        const stepIncrement = Number(configuration['step_increment']);
        const stepDuration = Number(configuration['step_duration']);
        let scheduledFrequency;
        let time = 0;

        oscillator.start(audioCtx.currentTime); 

        for (let i = 0; ; i++) {
            scheduledFrequency = startFreq + (i * stepIncrement);

            oscillator.frequency.setValueAtTime(scheduledFrequency, audioCtx.currentTime + time);

            if (scheduledFrequency >= stopFreq) {
                oscillator.frequency.setValueAtTime(stopFreq, audioCtx.currentTime + time);
                oscillator.stop(audioCtx.currentTime + time + stepDuration);
                break;
            }

            time += stepDuration;
        }
      }
    }

    function startPlaying() {
      console.log(configuration);
      console.log(oscRight);
      if (oscLeft !== null) {
        oscLeft.start();
      };

      if (oscRight !== null) {
        oscRight.start();
      }
    }

    function stopPlaying() {
      if (oscLeft !== null) {
        oscLeft.stop();
        oscLeft = null;
      }

      if (oscRight !== null) {
        oscRight.stop();
        oscRight = null;
      }
    }

    const settingsConstant = document.getElementById('settings_constant');
    const settingsSweep = document.getElementById('settings_sweep')
    const settingsSteps = document.getElementById('settings_steps')

    document.querySelectorAll('input[name="pattern"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        if (e.target.id === 'pattern_constant') {
          pattern = 'constant';
          settingsConstant.hidden = false;
          settingsSweep.hidden = true;
          settingsSteps.hidden = true;
        } else if (e.target.id === 'pattern_sweep') {
          pattern = 'sweep';
          settingsConstant.hidden = true;
          settingsSweep.hidden = false;
          settingsSteps.hidden = true;
        } else if (e.target.id === 'pattern_steps') {
          pattern = 'steps';
          settingsConstant.hidden = true;
          settingsSweep.hidden = true;
          settingsSteps.hidden = false;
        }
      });
    });
  </script>
</body>
</html>
